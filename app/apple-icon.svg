<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="SafaiWatch logo">
  <title>SafaiWatch</title>
  <defs>
    <linearGradient id="pinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bef264"/>
      <stop offset="0.5" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5; 360 .5 .5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="irisGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfccb"/>
      <stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <!-- Leaf-shaped location pin: pointed leaf tip at top right, pin point at bottom -->
    <clipPath id="pinClip">
      <path d="M100 172 C70 150 46 122 46 86 C46 52 72 30 118 24 C140 40 154 62 154 86 C154 122 130 150 100 172 Z"/>
    </clipPath>
    <clipPath id="eyeClip">
      <path d="M68 86 Q100 58 132 86 Q100 114 68 86 Z"/>
    </clipPath>
  </defs>

  <style>
    :root { --bg:#0f2a14; }

    .pin { opacity: 0; animation: drop 0.9s cubic-bezier(.3,1.4,.5,1) 0.2s forwards, bob 3.2s ease-in-out 1.6s infinite; }
    .body { fill: url(#pinGrad); }
    .glow { opacity: 0; animation: fade 1s ease 0.8s forwards, breathe 3.2s ease-in-out 1.8s infinite; }
    .shadow { fill: #000; opacity: 0; transform-box: fill-box; transform-origin: center;
              transform: scale(0.2); animation: land 0.9s ease-out 0.2s forwards; }

    /* AI texture: leaf veins drawn as a neural network */
    .vein { fill: none; stroke: #052e16; stroke-opacity: 0.55; stroke-width: 1.6; stroke-linecap: round; }
    .midrib { stroke-width: 2.6; stroke-opacity: 0.7; }
    .node { fill: #0f2a14; stroke: #ecfccb; stroke-width: 1.2; transform-box: fill-box; transform-origin: center;
            animation: nodePulse 2.4s ease-in-out infinite; }
    .n2 { animation-delay: 0.4s; } .n3 { animation-delay: 0.8s; } .n4 { animation-delay: 1.2s; }
    .n5 { animation-delay: 1.6s; } .n6 { animation-delay: 2.0s; } .n7 { animation-delay: 0.6s; }
    .signal { fill: #fff; }

    .eye { transform-box: fill-box; transform-origin: center; animation: blink 5s ease-in-out 1.8s infinite; }
    .sclera { fill: var(--bg); }
    .iris { fill: url(#irisGrad); animation: look 4s ease-in-out 1.4s infinite; }
    .pupil { fill: var(--bg); animation: look 4s ease-in-out 1.4s infinite; }
    .glint { fill: #fff; animation: look 4s ease-in-out 1.4s infinite; }

    @keyframes drop    { 0% { transform: translateY(-70px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes bob     { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes land    { 0% { transform: scale(0.2); opacity: 0; } 100% { transform: scale(1); opacity: 0.35; } }
    @keyframes blink   { 0%,90%,100% { transform: scaleY(1); } 94% { transform: scaleY(0.08); } }
    @keyframes look    { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-9px); } 60% { transform: translateX(9px); } 80% { transform: translateX(0); } }
    @keyframes fade    { to { opacity: 1; } }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @keyframes nodePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.5); } }

    @media (prefers-reduced-motion: reduce) {
      .pin { opacity: 1; animation: none; }
      .glow { opacity: 1; animation: none; }
      .shadow { opacity: 0.35; transform: none; animation: none; }
      .iris, .pupil, .glint, .eye, .node { animation: none; }
      .signal { display: none; }
    }
  </style>
  <circle class="glow" cx="100" cy="90" r="80" fill="url(#glow)"/>
  <ellipse class="shadow" cx="100" cy="180" rx="26" ry="5"/>

  <g class="pin">
    <path class="body" d="M100 172 C70 150 46 122 46 86 C46 52 72 30 118 24 C140 40 154 62 154 86 C154 122 130 150 100 172 Z"/>

    <g clip-path="url(#pinClip)">
      <!-- midrib (leaf spine) + side veins -->
      <path class="vein midrib" d="M100 172 Q98 140 100 106"/>
      <path class="vein" d="M99 152 Q82 144 70 128"/>
      <path class="vein" d="M99 152 Q118 144 130 128"/>
      <path class="vein" d="M99 132 Q84 126 62 110"/>
      <path class="vein" d="M99 132 Q116 126 138 110"/>
      <path class="vein midrib" d="M100 70 Q106 48 118 26"/>
      <path class="vein" d="M100 70 Q96 54 80 46"/>
      <path class="vein" d="M101 62 Q118 60 134 52"/>

      <!-- nodes -->
      <circle class="node n1" cx="70" cy="128" r="2.6"/>
      <circle class="node n2" cx="130" cy="128" r="2.6"/>
      <circle class="node n3" cx="62" cy="110" r="2.6"/>
      <circle class="node n4" cx="138" cy="110" r="2.6"/>
      <circle class="node n5" cx="80" cy="46" r="2.6"/>
      <circle class="node n6" cx="134" cy="52" r="2.6"/>
      <circle class="node n7" cx="100" cy="152" r="2.2"/>

      <!-- data signals travelling along the veins -->
      <circle class="signal" r="2">
        <animateMotion dur="2.4s" begin="1.4s" repeatCount="indefinite" path="M100 172 Q98 140 100 106"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle class="signal" r="1.8">
        <animateMotion dur="1.6s" begin="2.0s" repeatCount="indefinite" path="M99 152 Q82 144 70 128"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="1.6s" begin="2.0s" repeatCount="indefinite"/>
      </circle>
      <circle class="signal" r="1.8">
        <animateMotion dur="1.6s" begin="2.5s" repeatCount="indefinite" path="M99 152 Q118 144 130 128"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="1.6s" begin="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle class="signal" r="1.8">
        <animateMotion dur="1.8s" begin="1.8s" repeatCount="indefinite" path="M100 70 Q96 54 80 46"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="1.8s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle class="signal" r="1.8">
        <animateMotion dur="1.8s" begin="2.6s" repeatCount="indefinite" path="M101 62 Q118 60 134 52"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="1.8s" begin="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle class="signal" r="2">
        <animateMotion dur="2s" begin="2.2s" repeatCount="indefinite" path="M100 70 Q106 48 118 26"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="2s" begin="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g class="eye">
      <path class="sclera" d="M68 86 Q100 58 132 86 Q100 114 68 86 Z"/>
      <g clip-path="url(#eyeClip)">
        <circle class="iris" cx="100" cy="86" r="13"/>
        <circle class="pupil" cx="100" cy="86" r="6"/>
        <circle class="glint" cx="104" cy="82" r="2.2"/>
      </g>
    </g>
  </g>
</svg>
