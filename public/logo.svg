<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="logoPinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bef264"/>
      <stop offset="0.5" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="logoIrisGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfccb"/>
      <stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
    <radialGradient id="logoGlow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="logoPinClip">
      <path d="M100 172 C70 150 46 122 46 86 C46 52 72 30 118 24 C140 40 154 62 154 86 C154 122 130 150 100 172 Z"/>
    </clipPath>
    <clipPath id="logoEyeClip">
      <path d="M68 86 Q100 58 132 86 Q100 114 68 86 Z"/>
    </clipPath>
  </defs>

  <!-- Scaled Logo Mark on the left (80x80 bounding box) -->
