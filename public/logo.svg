  <!-- Typography -->
  <text x="84" y="44" font-family="'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#131B2E" letter-spacing="-0.02em">
    Safai<tspan fill="#006948">Watch</tspan>
  </text>
  <text x="85" y="60" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#006948" letter-spacing="0.14em">
