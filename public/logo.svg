    <circle cx="100" cy="90" r="80" fill="url(#logoGlow)"/>
    <ellipse cx="100" cy="180" rx="26" ry="5" fill="#000" opacity="0.3"/>

    <g>
      <path fill="url(#logoPinGrad)" d="M100 172 C70 150 46 122 46 86 C46 52 72 30 118 24 C140 40 154 62 154 86 C154 122 130 150 100 172 Z"/>

      <g clip-path="url(#logoPinClip)">
        <path fill="none" stroke="#052e16" stroke-opacity="0.7" stroke-width="2.6" stroke-linecap="round" d="M100 172 Q98 140 100 106"/>
        <path fill="none" stroke="#052e16" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round" d="M99 152 Q82 144 70 128"/>
        <path fill="none" stroke="#052e16" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round" d="M99 152 Q118 144 130 128"/>
        <path fill="none" stroke="#052e16" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round" d="M99 132 Q84 126 62 110"/>
        <path fill="none" stroke="#052e16" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round" d="M99 132 Q116 126 138 110"/>
        <path fill="none" stroke="#052e16" stroke-opacity="0.7" stroke-width="2.6" stroke-linecap="round" d="M100 70 Q106 48 118 26"/>
        <path fill="none" stroke="#052e16" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round" d="M100 70 Q96 54 80 46"/>
        <path fill="none" stroke="#052e16" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round" d="M101 62 Q118 60 134 52"/>

        <circle cx="70" cy="128" r="2.6" fill="#0f2a14" stroke="#ecfccb" stroke-width="1.2"/>
        <circle cx="130" cy="128" r="2.6" fill="#0f2a14" stroke="#ecfccb" stroke-width="1.2"/>
        <circle cx="62" cy="110" r="2.6" fill="#0f2a14" stroke="#ecfccb" stroke-width="1.2"/>
        <circle cx="138" cy="110" r="2.6" fill="#0f2a14" stroke="#ecfccb" stroke-width="1.2"/>
        <circle cx="80" cy="46" r="2.6" fill="#0f2a14" stroke="#ecfccb" stroke-width="1.2"/>
        <circle cx="134" cy="52" r="2.6" fill="#0f2a14" stroke="#ecfccb" stroke-width="1.2"/>
        <circle cx="100" cy="152" r="2.2" fill="#0f2a14" stroke="#ecfccb" stroke-width="1.2"/>
      </g>

      <g>
        <path fill="#0f2a14" d="M68 86 Q100 58 132 86 Q100 114 68 86 Z"/>
        <g clip-path="url(#logoEyeClip)">
          <circle cx="100" cy="86" r="13" fill="url(#logoIrisGrad)"/>
          <circle cx="100" cy="86" r="6" fill="#0f2a14"/>
          <circle cx="104" cy="82" r="2.2" fill="#fff"/>
        </g>
