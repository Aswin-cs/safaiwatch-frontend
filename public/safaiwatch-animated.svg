<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none" role="img" aria-label="SafaiWatch animated logo">
  <defs>
    <linearGradient id="swPinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bef264" />
      <stop offset="0.5" stop-color="#4ade80" />
      <stop offset="1" stop-color="#15803d" />
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5; 360 .5 .5" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="swIrisGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfccb" />
      <stop offset="1" stop-color="#84cc16" />
    </linearGradient>

    <radialGradient id="swGlowGrad" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.4" />
      <stop offset="1" stop-color="#4ade80" stop-opacity="0" />
    </radialGradient>

    <clipPath id="swPinClip">
      <path d="M100 172 C70 150 46 122 46 86 C46 52 72 30 118 24 C140 40 154 62 154 86 C154 122 130 150 100 172 Z" />
    </clipPath>

    <clipPath id="swEyeClip">
      <path d="M68 86 Q100 58 132 86 Q100 114 68 86 Z" />
    </clipPath>

    <style>
      :root { --bg: #0f2a14; }
      @keyframes swDrop { 0% { transform: translateY(-70px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }
      @keyframes swBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes swBlink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(0.08); } }
      @keyframes swLook { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-9px); } 60% { transform: translateX(9px); } 80% { transform: translateX(0); } }
      @keyframes swBreathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
      @keyframes swNodePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.5); } }

      .sw-pin { opacity: 0; animation: swDrop 0.9s cubic-bezier(.3,1.4,.5,1) 0.2s forwards, swBob 3.2s ease-in-out 1.6s infinite; }
      .sw-glow { opacity: 0; animation: swBreathe 3.2s ease-in-out 1.8s infinite; animation-fill-mode: forwards; }
      .sw-eye { transform-box: fill-box; transform-origin: center; animation: swBlink 5s ease-in-out 1.8s infinite; }
      .sw-iris { animation: swLook 4s ease-in-out 1.4s infinite; }
      .sw-pupil { animation: swLook 4s ease-in-out 1.4s infinite; }
      .sw-glint { animation: swLook 4s ease-in-out 1.4s infinite; }
      .sw-node { fill: #0f2a14; stroke: #ecfccb; stroke-width: 1.2; transform-box: fill-box; transform-origin: center; animation: swNodePulse 2.4s ease-in-out infinite; }
      .n2 { animation-delay: 0.4s; } .n3 { animation-delay: 0.8s; } .n4 { animation-delay: 1.2s; }
      .n5 { animation-delay: 1.6s; } .n6 { animation-delay: 2.0s; } .n7 { animation-delay: 0.6s; }
      .vein { fill: none; stroke: #052e16; stroke-opacity: 0.55; stroke-width: 1.6; stroke-linecap: round; }
      .midrib { stroke-width: 2.6; stroke-opacity: 0.7; }
    </style>
  </defs>

  <!-- Scaled Group Centered in 500x500 box -->
  <g transform="translate(60, 20) scale(1.9)">
    <circle class="sw-glow" cx="100" cy="90" r="80" fill="url(#swGlowGrad)" opacity="0.8" />
    <ellipse cx="100" cy="180" rx="26" ry="5" fill="#000" opacity="0.35" />

    <g class="sw-pin">
      <path fill="url(#swPinGrad)" d="M100 172 C70 150 46 122 46 86 C46 52 72 30 118 24 C140 40 154 62 154 86 C154 122 130 150 100 172 Z" />

      <g clip-path="url(#swPinClip)">
        <path class="vein midrib" d="M100 172 Q98 140 100 106" />
        <path class="vein" d="M99 152 Q82 144 70 128" />
        <path class="vein" d="M99 152 Q118 144 130 128" />
        <path class="vein" d="M99 132 Q84 126 62 110" />
        <path class="vein" d="M99 132 Q116 126 138 110" />
        <path class="vein midrib" d="M100 70 Q106 48 118 26" />
        <path class="vein" d="M100 70 Q96 54 80 46" />
        <path class="vein" d="M101 62 Q118 60 134 52" />

        <circle class="sw-node n1" cx="70" cy="128" r="2.6" />
        <circle class="sw-node n2" cx="130" cy="128" r="2.6" />
        <circle class="sw-node n3" cx="62" cy="110" r="2.6" />
        <circle class="sw-node n4" cx="138" cy="110" r="2.6" />
        <circle class="sw-node n5" cx="80" cy="46" r="2.6" />
        <circle class="sw-node n6" cx="134" cy="52" r="2.6" />
        <circle class="sw-node n7" cx="100" cy="152" r="2.2" />

        <circle fill="#fff" r="2">
          <animateMotion dur="2.4s" begin="1.4s" repeatCount="indefinite" path="M100 172 Q98 140 100 106" />
          <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.4s" repeatCount="indefinite" />
        </circle>
        <circle fill="#fff" r="1.8">
          <animateMotion dur="1.6s" begin="2.0s" repeatCount="indefinite" path="M99 152 Q82 144 70 128" />
          <animate attributeName="opacity" values="0;1;1;0" dur="1.6s" begin="2.0s" repeatCount="indefinite" />
        </circle>
        <circle fill="#fff" r="1.8">
          <animateMotion dur="1.6s" begin="2.5s" repeatCount="indefinite" path="M99 152 Q118 144 130 128" />
          <animate attributeName="opacity" values="0;1;1;0" dur="1.6s" begin="2.5s" repeatCount="indefinite" />
        </circle>
        <circle fill="#fff" r="1.8">
          <animateMotion dur="1.8s" begin="1.8s" repeatCount="indefinite" path="M100 70 Q96 54 80 46" />
          <animate attributeName="opacity" values="0;1;1;0" dur="1.8s" begin="1.8s" repeatCount="indefinite" />
        </circle>
        <circle fill="#fff" r="1.8">
          <animateMotion dur="1.8s" begin="2.6s" repeatCount="indefinite" path="M101 62 Q118 60 134 52" />
          <animate attributeName="opacity" values="0;1;1;0" dur="1.8s" begin="2.6s" repeatCount="indefinite" />
        </circle>
        <circle fill="#fff" r="2">
          <animateMotion dur="2s" begin="2.2s" repeatCount="indefinite" path="M100 70 Q106 48 118 26" />
          <animate attributeName="opacity" values="0;1;1;0" dur="2s" begin="2.2s" repeatCount="indefinite" />
        </circle>
      </g>

      <g class="sw-eye">
        <path d="M68 86 Q100 58 132 86 Q100 114 68 86 Z" fill="#0f2a14" />
        <g clip-path="url(#swEyeClip)">
          <circle class="sw-iris" cx="100" cy="86" r="13" fill="url(#swIrisGrad)" />
          <circle class="sw-pupil" cx="100" cy="86" r="6" fill="#0f2a14" />
          <circle class="sw-glint" cx="104" cy="82" r="2.2" fill="#fff" />
        </g>
      </g>
    </g>
  </g>

  <!-- Brand Typography centered at bottom -->
  <text x="250" y="420" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, sans-serif" font-size="34" font-weight="800" fill="#131B2E" letter-spacing="-0.02em">
    Safai<tspan fill="#006948">Watch</tspan>
  </text>
  <text x="250" y="450" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#006948" letter-spacing="0.2em">
    CIVIC ACTION &amp; CLEANLINESS NETWORK
  </text>
</svg>
